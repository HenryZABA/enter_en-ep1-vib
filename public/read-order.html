<html><body><script>
const data = JSON.parse(localStorage.getItem('slide-groups') || '{}');
const groups = data.groups || [];
const db = groups.find(g => g.name === '答辩');
if (db) {
  document.body.innerText = JSON.stringify(db.slideIndices);
} else {
  document.body.innerText = 'NOT FOUND: ' + JSON.stringify(groups.map(g=>g.name));
}
</script></body></html>
